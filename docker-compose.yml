# Local services for the MCU GraphRAG project.
#   Start:  docker compose up -d        (needs NEO4J_PASSWORD in .env; see .env.example)
#   Stop:   docker compose down         (the graph is kept in the mcu-neo4j-data volume)
#   Reset:  docker compose down -v      (deletes the graph)
# Neo4j Browser: http://localhost:7474   Bolt: bolt://localhost:7687 (user neo4j)

services:
  neo4j:
    image: neo4j:2026.10.2-community   # pinned so every clone runs the same version
    container_name: mcu-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP / Neo4j Browser
      - "7687:7687"   # Bolt (Python driver)
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env (see .env.example)}"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  neo4j-data:
    name: mcu-neo4j-data
