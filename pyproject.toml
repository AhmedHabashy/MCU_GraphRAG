[project]
name = "mcu-graphrag"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["requests"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "validation: checks collected data in source_data/ (run after collection)",
]
