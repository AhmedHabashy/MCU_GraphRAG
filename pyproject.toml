[project]
name = "mcu-graphrag"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["requests", "python-dotenv", "mwparserfromhell", "neo4j", "flask"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "validation: checks collected data in source_data/ (run after collection)",
    "neo4j: checks the running Neo4j database (docker compose up -d)",
]
